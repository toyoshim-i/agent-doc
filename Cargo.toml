[package]
name = "agent-doc"
version = "0.3.0"
edition = "2021"
authors = ["Takashi Toyoshima <toyoshim@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Context-engineering-free, agent-native documentation and explain engine for command-line tools"
repository = "https://github.com/toyoshim-i/agent-doc"
readme = "README.md"
keywords = ["cli", "documentation", "agent", "markdown", "hyperlink"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
build = []
mcp = []
mcp-stdio = ["mcp"]
mcp-http = ["mcp"]
clap = ["dep:clap", "mcp"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.0", optional = true }
