[package]
name = "agent-man"
version = "0.6.0"
edition = "2021"
authors = ["Takashi Toyoshima <toyoshim@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Context-engineering-free, agent-native documentation and explain engine for command-line tools"
repository = "https://github.com/toyoshim-i/agent-man"
readme = "README.md"
keywords = ["cli", "documentation", "agent", "markdown", "hyperlink"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
build = []
mcp = []
mcp-stdio = ["mcp"]
mcp-http = ["mcp"]
clap = ["dep:clap", "mcp"]
cli = ["clap", "clap/derive", "mcp-stdio", "mcp-http"]
webmcp = [
    "mcp",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
]

[[bin]]
name = "agent-man-cli"
path = "src/bin/agent-man-cli.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Navigator", "Performance"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
clap = { version = "4.0", features = ["derive"] }

